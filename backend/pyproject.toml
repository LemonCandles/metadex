[project]
name = "metadex-backend"
version = "0.1.0"
description = "Pipeline de dados e API do Metadex"
readme = "../README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "duckdb>=1.4.0",
    "fastapi>=0.118.0",
    "httpx>=0.28.0",
    "pandas>=2.3.0",
    "pyarrow>=21.0.0",
    "pydantic-settings>=2.10.0",
    "uvicorn[standard]>=0.37.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.13.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
